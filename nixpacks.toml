# nixpacks.toml — Coolify build fix
# 1. Bypass corepack ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING (corepack 0.24.1 + Node 22 bug)
# 2. pnpm@11.22.0 requires Node>=22.13; nixpacks Node 22 image ships v22.11.0.
#    Use pnpm@10 (requires Node>=18.12) via npm global install.
# 3. Set manage-package-manager-versions=false so pnpm@10 ignores the `packageManager`
#    field and does NOT try to self-upgrade (which fails with ENOENT in this env).
# 4. Override start to run Node.js server (pm2-runtime), not nixpacks Caddy SPA mode.

[phases.install]
cmds = [
  "corepack disable",
  "npm install --global pnpm@10",
  "$(npm prefix -g)/bin/pnpm config set manage-package-manager-versions false --global",
  "$(npm prefix -g)/bin/pnpm install --frozen-lockfile"
]

[start]
cmd = "pnpm start"
